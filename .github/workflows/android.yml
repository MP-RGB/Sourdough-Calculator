name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply bread icon
        run: cp -r res-overrides/* android/app/src/main/res/

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wheat-sourdough.apk

      - name: Upload APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: wheat-sourdough-apk
          path: wheat-sourdough.apk

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Wheat Sourdough v${{ github.run_number }}
          files: wheat-sourdough.apk
          
